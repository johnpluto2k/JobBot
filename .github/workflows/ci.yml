name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Checker tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r tools/requirements.txt
      - run: python -m pytest
      - name: Example résumé passes the checker
        run: python tools/check_resume.py examples/sam_rivera_resume.pdf --tex examples/sam_rivera_resume.tex

  no-personal-files:
    name: No private folders tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if git ls-files | grep -E '^(documents|resume|applications|coach|data|inputs)/' | grep -vxE '(documents|applications)/README\.md'; then
            echo "Private folders must never be committed." >&2
            exit 1
          fi
