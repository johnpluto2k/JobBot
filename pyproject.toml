[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "job-bot"
dynamic = ["version"]
description = "A local-first operating system for a job search: profile, posting watcher, résumé tailoring, application tracking from Gmail, and a coach that reads the real numbers."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["job-search", "resume", "ats", "applications", "fastapi", "react", "sqlite", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Framework :: FastAPI",
]

# What the dashboard, tracker, watcher, tailoring and coach need. Everything
# heavier is imported lazily and lives in an extra below.
dependencies = [
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "requests>=2.31",
    # documents in, documents out
    "python-docx>=1.1",
    "pymupdf>=1.24",
    "pymupdf4llm>=0.0.17",
    "reportlab>=4.1",
    # dashboard + API
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "apscheduler>=3.10",
    # optional at runtime (no key, no calls), but small
    "anthropic>=0.40",
    "google-api-python-client>=2.130",
    "google-auth>=2.29",
]

[project.optional-dependencies]
# RenderCV / Typst résumé renderer (generate.py --renderer rendercv)
rendercv = ["rendercv[full]>=2.0"]
# Browser autofill and posting-liveness checks. Then: python -m playwright install chromium
browser = ["playwright>=1.44"]
# Find Jobs multi-board search. JobSpy pins a numpy with no Python 3.14 wheel;
# on 3.14 see docs/SETUP.md for the --no-deps install.
search = ["python-jobspy>=1.1; python_version < '3.14'"]
# Vector store for the profile, and the legacy Streamlit dashboard
legacy = ["chromadb>=0.5", "streamlit>=1.35", "pandas>=2.2"]
dev = ["pytest>=8.0", "httpx>=0.27"]
all = ["job-bot[rendercv,browser,search,legacy,dev]"]

[project.scripts]
job-bot = "job_bot.__main__:main"

[project.urls]
Homepage = "https://github.com/johnpluto2k/JobBot"
Issues = "https://github.com/johnpluto2k/JobBot/issues"
Changelog = "https://github.com/johnpluto2k/JobBot/blob/main/docs/CHANGELOG.md"

[tool.setuptools]
packages = ["job_bot", "job_bot.deprecated"]

[tool.setuptools.dynamic]
version = { attr = "job_bot.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
